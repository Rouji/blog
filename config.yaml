baseURL: 'https://b.r0.at/'
locale: 'en-us'
title: 'Wurstkäse'
theme: 'PaperMod'

markup:
  goldmark:
    renderer:
      unsafe: true

security:
  allowContent: ['.*']

# defaultContentLanguage: en
disableDefaultLanguageRedirect: true
defaultContentLanguageInSubdir: true
languages:
  en:
    label: English
    weight: 1
    params:
      homeInfoParams:
        Title: Hello!
        Content: This be a blog.

  ja:
    label: 日本語
    weight: 2
    params:
      homeInfoParams:
        Title: こんちわ
        Content: これブログね。

  de:
    label: Deutsch
    weight: 3
    params:
      homeInfoParams:
        Title: Hallo!
        Content: Das hier n Blog.

params:
  defaultTheme: light
  env: production
  cover:
    responsiveImages: true
    linkFullImages: true
  socialIcons:
    - name: github
      title: Github
      url: "https://github.com/Rouji"
    - name: email
      title: E-Mail
      url: "mailto:a@r0.at"
    - name: Misskey
      title: Misskey
      url: "https://misskey.io/@marupan"
    - name: Soundcloud
      title: Soundcloud
      url: "https://soundcloud.com/rouji"
    - name: Matrix
      title: Message me on Matrix
      url: "https://matrix.to/#/@a:r0.at"
    - name: Youtube
      title: Look at bad videos
      url: "https://www.youtube.com/@abunchofmusic8903/videos"
  editPost:
    URL: "https://github.com/Rouji/blog/edit/master/content"
    Text: "Suggest Changes"
    appendFilePath: true
