{{- $model_file := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $resource := .Page.Resources.GetMatch $model_file -}}
{{- $src := $model_file -}}
{{- with $resource -}}{{- $src = .RelPermalink -}}{{- end -}}
{{- $orbit := .Get "orbit" -}}
{{- $height := .Get "height" | default "auto" -}}
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
<model-viewer src="{{ $src }}" alt="{{ $alt }}" camera-controls touch-action="pan-y" color="#000000"{{ if $orbit }} camera-orbit="{{ $orbit }}"{{ end }} style="width: 100%; height: {{ $height }};"></model-viewer>
